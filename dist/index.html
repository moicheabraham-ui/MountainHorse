<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>SftpDrive</title>
<style>
  :root { color-scheme: dark; --bg:#14161a; --card:#1d2026; --line:#2c313a; --fg:#e6e8eb; --mut:#8b93a1; --ok:#22c55e; --acc:#3b82f6; --bad:#ef4444; }
  * { box-sizing: border-box; }
  body { margin:0; padding:20px; background:var(--bg); color:var(--fg); font:14px system-ui, sans-serif; }
  h1 { font-size:18px; margin:0 0 16px; display:flex; justify-content:space-between; align-items:center; }
  button { background:var(--acc); color:#fff; border:0; border-radius:6px; padding:7px 14px; cursor:pointer; font:inherit; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--fg); }
  button.bad { background:transparent; border:1px solid var(--bad); color:var(--bad); }
  .banner { background:#3b2a12; border:1px solid #92602a; padding:10px 14px; border-radius:8px; margin-bottom:16px; }
  .banner a { color:#fbbf24; }
  .row { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; display:flex; gap:12px; align-items:center; }
  .row .info { flex:1; min-width:0; }
  .row .name { font-weight:600; }
  .row .sub { color:var(--mut); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--line); flex:none; }
  .dot.on { background:var(--ok); }
  .empty { color:var(--mut); text-align:center; padding:40px 0; }
  form { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; display:none; grid-template-columns:1fr 1fr; gap:10px; }
  form.open { display:grid; }
  label { display:flex; flex-direction:column; gap:4px; color:var(--mut); font-size:12px; }
  input, select { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:7px 9px; font:inherit; }
  .full { grid-column:1 / -1; }
  .check { flex-direction:row; align-items:center; gap:8px; color:var(--fg); }
  .actions { grid-column:1 / -1; display:flex; gap:8px; justify-content:flex-end; }
  #msg { margin-bottom:12px; color:var(--bad); white-space:pre-wrap; }
</style>
</head>
<body>
<h1>SftpDrive <button id="new">+ Nueva conexión</button></h1>
<div id="banner" class="banner" hidden>
  Falta instalar <b>WinFsp</b> y <b>SSHFS-Win</b> para poder montar unidades:
  <a href="https://github.com/winfsp/winfsp/releases" target="_blank">WinFsp</a> ·
  <a href="https://github.com/winfsp/sshfs-win/releases" target="_blank">SSHFS-Win</a>
</div>
<div id="msg"></div>
<form id="form">
  <input type="hidden" name="id">
  <label>Nombre <input name="name" required></label>
  <label>Unidad <select name="drive"></select></label>
  <label>Servidor <input name="host" placeholder="192.168.1.10" required></label>
  <label>Puerto <input name="port" type="number" value="22" required></label>
  <label>Usuario <input name="user" required></label>
  <label>Contraseña <input name="password" type="password" placeholder="(dejar vacío para no cambiarla)"></label>
  <label class="full">Carpeta remota <input name="remotePath" placeholder="/home/usuario (vacío = carpeta personal)"></label>
  <label class="check full"><input name="useKey" type="checkbox"> Usar clave SSH (%USERPROFILE%\.ssh\id_rsa) en vez de contraseña</label>
  <div class="actions"><button type="button" class="ghost" id="cancel">Cancelar</button><button>Guardar</button></div>
</form>
<div id="list"></div>
<script>
const { invoke } = window.__TAURI__.core;
const $ = (s) => document.querySelector(s);
const form = $('#form');
let conns = [];

const letters = [...'ZYXWVUTSRQPONMLKJIHGFED'];
$('select[name=drive]').innerHTML = letters.map(l => `<option>${l}</option>`).join('');

const show = (m) => { $('#msg').textContent = m || ''; };
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

async function refresh() {
  conns = await invoke('list_connections');
  $('#list').innerHTML = conns.length ? conns.map(c => `
    <div class="row">
      <span class="dot ${c.mounted ? 'on' : ''}"></span>
      <div class="info">
        <div class="name">${esc(c.name)} <span class="sub">(${esc(c.drive)}:)</span></div>
        <div class="sub">${esc(c.user)}@${esc(c.host)}:${c.port}${esc(c.remotePath || '')}</div>
      </div>
      <button data-a="${c.mounted ? 'unmount' : 'mount'}" data-id="${c.id}">${c.mounted ? 'Desmontar' : 'Montar'}</button>
      <button class="ghost" data-a="edit" data-id="${c.id}">Editar</button>
      <button class="bad" data-a="delete" data-id="${c.id}">Borrar</button>
    </div>`).join('') : '<div class="empty">Aún no hay conexiones.</div>';
}

function openForm(c) {
  form.reset();
  form.id.value = c?.id || '';
  for (const k of ['name', 'drive', 'host', 'port', 'user', 'remotePath']) if (c) form[k].value = c[k];
  form.useKey.checked = !!c?.useKey;
  if (!c) form.drive.value = letters.find(l => !conns.some(x => x.drive === l)) || 'Z';
  form.classList.add('open');
}

$('#new').onclick = () => openForm();
$('#cancel').onclick = () => form.classList.remove('open');

form.onsubmit = async (e) => {
  e.preventDefault();
  show();
  const f = form;
  try {
    await invoke('save_connection', {
      conn: { id: f.id.value, name: f.name.value, host: f.host.value, port: +f.port.value, user: f.user.value,
              remotePath: f.remotePath.value, drive: f.drive.value, useKey: f.useKey.checked },
      password: f.password.value || null,
    });
    f.classList.remove('open');
    await refresh();
  } catch (err) { show(err); }
};

$('#list').onclick = async (e) => {
  const b = e.target.closest('button[data-a]');
  if (!b) return;
  const { a, id } = b.dataset;
  show();
  try {
    if (a === 'edit') return openForm(conns.find(c => c.id === id));
    if (a === 'delete' && !confirm('¿Borrar esta conexión?')) return;
    b.disabled = true;
    await invoke(a === 'delete' ? 'delete_connection' : a, { id });
  } catch (err) { show(err); }
  await refresh();
};

invoke('check_prereqs').then(ok => { $('#banner').hidden = ok; });
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
