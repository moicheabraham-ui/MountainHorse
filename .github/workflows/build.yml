name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx tauri icon app-icon.png
      - name: Download WinFsp and SSHFS-Win (bundled into the installer)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p src-tauri/resources
          gh release download --repo winfsp/winfsp --pattern 'winfsp-*.msi' --output src-tauri/resources/winfsp.msi
          gh release download --repo winfsp/sshfs-win --pattern 'sshfs-win-*-x64.msi' --output src-tauri/resources/sshfs-win.msi
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: SftpDrive-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" src-tauri/target/release/bundle/nsis/*.exe --title "SftpDrive $GITHUB_REF_NAME" --generate-notes
