name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx tauri icon app-icon.png
      - name: Download WinFsp and SSHFS-Win (bundled into the installer)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p src-tauri/resources
          # pinned versions + SHA-256, so a changed or tampered upstream release cannot end up in the installer
          gh release download v2.1 --repo winfsp/winfsp --pattern 'winfsp-2.1.25156.msi' --output src-tauri/resources/winfsp.msi
          gh release download v3.5.20357 --repo winfsp/sshfs-win --pattern 'sshfs-win-3.5.20357-x64.msi' --output src-tauri/resources/sshfs-win.msi
          cd src-tauri/resources
          echo "073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a  winfsp.msi" | sha256sum -c -
          echo "1657e397f8dce1c2d2e3220007f9c9f882631882b9bec4608f7835e87dcd096c  sshfs-win.msi" | sha256sum -c -
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: MountainHorse-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
      - name: Publish release (installer, signature and latest.json for the in-app updater)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          cd src-tauri/target/release/bundle/nsis
          cp "Mountain Horse_${v}_x64-setup.exe" "Mountain.Horse_${v}_x64-setup.exe"
          cp "Mountain Horse_${v}_x64-setup.exe.sig" "Mountain.Horse_${v}_x64-setup.exe.sig"
          V="$v" REPO="$GITHUB_REPOSITORY" node -e '
            const fs = require("fs");
            const v = process.env.V;
            const sig = fs.readFileSync(`Mountain.Horse_${v}_x64-setup.exe.sig`, "utf8").trim();
            const url = `https://github.com/${process.env.REPO}/releases/download/v${v}/Mountain.Horse_${v}_x64-setup.exe`;
            fs.writeFileSync("latest.json", JSON.stringify({
              version: v,
              notes: `Mountain Horse v${v}`,
              pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": { signature: sig, url } },
            }, null, 2));
          '
          gh release create "$GITHUB_REF_NAME" "Mountain.Horse_${v}_x64-setup.exe" "Mountain.Horse_${v}_x64-setup.exe.sig" latest.json --title "Mountain Horse $GITHUB_REF_NAME" --generate-notes
